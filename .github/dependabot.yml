# Dependency updates: weekly, grouped, and only for versions at least 3 days old
# (the same supply-chain delay as `minimumReleaseAge` in pnpm-workspace.yaml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      non-major:
        update-types: [minor, patch]
    ignore:
      # Stay on TypeScript 6.0.x: typescript-eslint supports TypeScript up to <6.1.
      - dependency-name: typescript
        versions: ['>=6.1']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
