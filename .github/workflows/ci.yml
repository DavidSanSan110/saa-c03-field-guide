name: CI

on:
  pull_request:
    # labeled/unlabeled: adding or removing `tests-approved` re-runs the test-lock.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit and test-lock checks walk the PR's commits
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every check below runs even if an earlier one failed, so one push reports all problems.
      - name: Guardrails on all tracked files
        if: ${{ !cancelled() }}
        run: pnpm guardrails paths --all

      - name: Guardrails on the PR's commit messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: pnpm guardrails commits --base "$BASE"

      - name: Commitlint the PR's commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: pnpm exec commitlint --from "$BASE" --to HEAD --verbose

      # The owner lifts the test-lock with the `tests-approved` label (D13).
      - name: Test-lock
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'tests-approved') }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: pnpm guardrails test-lock --base "$BASE"

      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Unit tests with coverage
        if: ${{ !cancelled() }}
        run: pnpm coverage

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm -r --if-present build

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
