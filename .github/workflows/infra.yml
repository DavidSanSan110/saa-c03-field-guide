name: Infra

# Lab infrastructure changes only through here (spec 033):
#   pull request   read-only plan of the labs it touches, as a PR comment, plus a cost estimate
#   push to main   plan, approval in the `infra` environment, re-plan, apply only the approved change set
#   dispatch       plan, apply or destroy one lab on demand
# No `paths` filter: the required `tf-plan` check must always report, never sit on "pending".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the lab
        type: choice
        options: [plan, apply, destroy]
        default: plan
      stack:
        description: The lab stack, for example labs/99-ci-smoke
        type: string
        required: true
      confirm:
        description: For destroy only, type exactly "destroy <stack>"
        type: string
        default: ''

permissions: {}

# A pull request run is replaced by a newer one; a push or dispatch run is never cancelled.
concurrency:
  group: infra-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  stacks:
    name: stacks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.select.outputs.stacks }}
      mode: ${{ steps.select.outputs.mode }}
      can_plan: ${{ steps.select.outputs.can_plan }}
    steps:
      # Fails the job before anything runs: only main may be dispatched, and a destroy needs the
      # lab's name typed back.
      - name: Check the dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          STACK: ${{ inputs.stack }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main, not from $GITHUB_REF."
            exit 1
          fi
          case "$ACTION" in
            plan | apply) ;;
            destroy)
              if [ "$CONFIRM" != "destroy $STACK" ]; then
                echo "::error::To destroy a lab, type exactly 'destroy <stack>' in confirm."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown action: $ACTION"
              exit 1
              ;;
          esac

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the stacks come from the diff against the base branch or the pushed range
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `shell: bash` runs with pipefail, so a failing lab-stacks fails the step instead of
      # publishing pnpm's error line. pnpm prints a banner first: the JSON array is the last line.
      - name: Work out the stacks, the mode and whether CI may plan
        id: select
        shell: bash
        env:
          BASE: origin/${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          STACK: ${{ inputs.stack }}
          ACTION: ${{ inputs.action }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              stacks="$(pnpm guardrails lab-stacks --base "$BASE" | tail -n 1)"
              mode=plan
              ;;
            push)
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                stacks="$(pnpm guardrails lab-stacks --all | tail -n 1)"
              else
                stacks="$(pnpm guardrails lab-stacks --base "$BEFORE" --head "$AFTER" | tail -n 1)"
              fi
              mode=apply
              ;;
            *)
              stacks="$(pnpm guardrails lab-stacks --stack "$STACK" | tail -n 1)"
              mode="$ACTION"
              ;;
          esac
          case "$stacks" in
            "["*) ;;
            *)
              echo "::error::lab-stacks did not print a JSON array: $stacks"
              exit 1
              ;;
          esac
          # Pull requests from forks and from Dependabot get neither the OIDC token nor the secrets.
          can_plan=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
              can_plan=false
            fi
          fi
          {
            echo "stacks=$stacks"
            echo "mode=$mode"
            echo "can_plan=$can_plan"
          } >> "$GITHUB_OUTPUT"
          echo "Stacks: $stacks, mode: $mode, can plan: $can_plan"

  # Read-only: no environment, the plan role. The full plan goes to this job's log only; what the
  # other jobs get is a digest of the change set and a summary without any attribute value.
  plan:
    name: plan (${{ matrix.stack }})
    needs: stacks
    if: ${{ needs.stacks.outputs.stacks != '[]' && needs.stacks.outputs.can_plan == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.stacks) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.stack }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Terraform version
        id: terraform-version
        # Runs from the repository root: `.terraform-version` is the single source of the version.
        working-directory: ${{ github.workspace }}
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      # Plain Node runs the digest CLI: no pnpm install and no cache in a job that holds AWS credentials.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Log in to AWS
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Init
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
          STACK: ${{ matrix.stack }}
        run: |
          : "${ACCOUNT_ID:?the AWS login returned no account id}"
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=field-guide-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=${STACK}.tfstate" \
            -backend-config="region=eu-west-1"

      - name: Plan
        env:
          MODE: ${{ needs.stacks.outputs.mode }}
        run: |
          destroy=()
          if [ "$MODE" = "destroy" ]; then
            destroy=(-destroy)
          fi
          terraform plan -lock=false -input=false -out=tfplan "${destroy[@]}"

      - name: Digest and summarise the plan
        id: meta
        env:
          STACK: ${{ matrix.stack }}
        run: |
          terraform show -json tfplan > plan.json
          meta="$RUNNER_TEMP/plan-meta"
          mkdir -p "$meta"
          digest="$(node --experimental-strip-types "$GITHUB_WORKSPACE/tools/guardrails/src/terraform-plan-cli.ts" digest plan.json)"
          changed="$(node --experimental-strip-types "$GITHUB_WORKSPACE/tools/guardrails/src/terraform-plan-cli.ts" changed plan.json)"
          node --experimental-strip-types "$GITHUB_WORKSPACE/tools/guardrails/src/terraform-plan-cli.ts" summary plan.json "$STACK" > "$meta/summary.md"
          cat "$meta/summary.md" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg stack "$STACK" --arg digest "$digest" --argjson changed "$changed" \
            '{stack: $stack, digest: $digest, changed: $changed}' > "$meta/meta.json"
          echo "lab_id=${STACK#labs/}" >> "$GITHUB_OUTPUT"

      # Only these two files leave the job: never the plan file or its JSON.
      - name: Upload the plan metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-meta-${{ steps.meta.outputs.lab_id }}
          path: |
            ${{ runner.temp }}/plan-meta/meta.json
            ${{ runner.temp }}/plan-meta/summary.md
          if-no-files-found: error
          retention-days: 3

      - name: Delete the plan files
        if: always()
        run: rm -f tfplan plan.json

  # Which stacks changed and the digest of each approved change set, for `apply` and its approval.
  changes:
    name: changes
    needs: [stacks, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
      digests: ${{ steps.collect.outputs.digests }}
    steps:
      - name: Download the plan metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plan-meta-*
          path: plan-meta

      - name: Collect the changed stacks and their digests
        id: collect
        shell: bash
        env:
          MODE: ${{ needs.stacks.outputs.mode }}
        run: |
          changed="$(jq -cs '[.[] | select(.changed) | .stack] | sort' plan-meta/*/meta.json)"
          digests="$(jq -cs 'map({(.stack): .digest}) | add // {}' plan-meta/*/meta.json)"
          {
            echo "changed=$changed"
            echo "digests=$digests"
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            {
              echo "### Approval"
              echo
              if [ "$MODE" = "plan" ]; then
                echo "Plan only: nothing is applied."
              elif [ "$changed" = "[]" ]; then
                echo "No lab has changes to $MODE: nothing awaits approval."
              else
                echo "Waiting for approval in the infra environment to $MODE:"
                echo
                jq -r '.[] | "- <code>\(.)</code>"' <<< "$changed"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # One comment per pull request, updated by every run.
  report:
    name: report
    needs: plan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download the plan metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plan-meta-*
          path: plan-meta

      - name: Create or update the plan comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo "<!-- infra-plan -->"
            echo "## Terraform plan"
            echo
            size=0
            for summary in plan-meta/*/summary.md; do
              size=$((size + $(wc -c < "$summary")))
              if [ "$size" -gt 50000 ]; then
                echo "Summary of $(basename "$(dirname "$summary")") left out: too long for one comment."
              else
                cat "$summary"
              fi
              echo
            done
            echo "Full plans are in the job log of $RUN_URL."
          } > "$body"
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- infra-plan -->"))) | .id')"
          comment_id="${existing%%$'\n'*}"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" --field "body=@$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" --field "body=@$body" > /dev/null
          fi

  # Cost estimate from the HCL alone: no plan file and no AWS credentials. Not part of tf-plan.
  infracost:
    name: infracost
    needs: stacks
    if: ${{ github.event_name == 'pull_request' && needs.stacks.outputs.can_plan == 'true' && needs.stacks.outputs.stacks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release is pinned by version and by the SHA-256 of the tarball (checked before extracting).
      - name: Install infracost
        shell: bash
        run: |
          archive="$RUNNER_TEMP/infracost-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/infracost/infracost/releases/download/v0.10.46/infracost-linux-amd64.tar.gz
          echo "d0d081cd39b07b2ca5c315830bfc4bcdfb0183b04c19cb18835c154482a2c97b  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/infracost-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/infracost-bin"
          mv "$RUNNER_TEMP/infracost-bin/infracost-linux-amd64" "$RUNNER_TEMP/infracost-bin/infracost"
          echo "$RUNNER_TEMP/infracost-bin" >> "$GITHUB_PATH"

      - name: Estimate the cost and comment
        shell: bash
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_ENABLE_CLOUD: 'false'
          INFRACOST_SKIP_UPDATE_CHECK: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          STACKS: ${{ needs.stacks.outputs.stacks }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out="$RUNNER_TEMP/infracost-out"
          mkdir -p "$out"
          mapfile -t stacks < <(jq -r '.[]' <<< "$STACKS")
          for stack in "${stacks[@]}"; do
            infracost breakdown --path "$stack" --format json --out-file "$out/${stack#labs/}.json"
          done
          infracost output --path "$out/*.json" --format json --out-file "$RUNNER_TEMP/infracost-combined.json"
          infracost comment github --path "$RUNNER_TEMP/infracost-combined.json" \
            --repo "$REPO" --pull-request "$PR" --github-token "$GITHUB_TOKEN" --behavior=update

  # Needs the owner's approval. It plans again with the apply role and applies only the saved plan,
  # and only if its change set is the one that was shown.
  apply:
    name: apply (${{ matrix.stack }})
    needs: [stacks, changes]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.stacks.outputs.mode == 'apply' || needs.stacks.outputs.mode == 'destroy') && needs.changes.outputs.changed != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: infra
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-apply-${{ matrix.stack }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.changed) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.stack }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An approval can wait for days. If main has moved on, this run would apply a plan made from
      # an older commit and could undo newer changes. The checkout's origin is this public
      # repository, so no token is needed to read its tip.
      - name: Refuse a run that is not the tip of main
        run: |
          remote="$(git ls-remote origin refs/heads/main)"
          tip="${remote%%[[:space:]]*}"
          if [ -z "$tip" ] || [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::This run is not for the current tip of main, so it could undo newer changes. Dispatch apply (or destroy) for the stack instead."
            exit 1
          fi
          echo "This run is for the tip of main: $tip"

      - name: Read the Terraform version
        id: terraform-version
        working-directory: ${{ github.workspace }}
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Log in to AWS
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Init
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
          STACK: ${{ matrix.stack }}
        run: |
          : "${ACCOUNT_ID:?the AWS login returned no account id}"
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=field-guide-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=${STACK}.tfstate" \
            -backend-config="region=eu-west-1"

      - name: Plan
        env:
          MODE: ${{ needs.stacks.outputs.mode }}
        run: |
          destroy=()
          if [ "$MODE" = "destroy" ]; then
            destroy=(-destroy)
          fi
          terraform plan -input=false -out=tfplan "${destroy[@]}"

      - name: Digest the plan
        id: digest
        run: |
          terraform show -json tfplan > plan.json
          digest="$(node --experimental-strip-types "$GITHUB_WORKSPACE/tools/guardrails/src/terraform-plan-cli.ts" digest plan.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check the change set is the approved one
        env:
          EXPECTED: ${{ fromJSON(needs.changes.outputs.digests)[matrix.stack] }}
          ACTUAL: ${{ steps.digest.outputs.digest }}
        run: |
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::The change set differs from the approved one, so nothing was applied. Dispatch apply (or destroy) for the stack to plan it again and approve the new change set."
            exit 1
          fi
          echo "The change set matches the approved digest: $ACTUAL"

      - name: Apply the saved plan
        run: terraform apply -input=false tfplan

      - name: Delete the plan files
        if: always()
        run: rm -f tfplan plan.json

  # Read-only check of what was just applied, with the plan role (subject: refs/heads/main).
  verify:
    name: verify (${{ matrix.stack }})
    needs: [stacks, changes, apply]
    if: ${{ needs.stacks.outputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.changed) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.stack }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Terraform version
        id: terraform-version
        working-directory: ${{ github.workspace }}
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Log in to AWS
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Init
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
          STACK: ${{ matrix.stack }}
        run: |
          : "${ACCOUNT_ID:?the AWS login returned no account id}"
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=field-guide-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=${STACK}.tfstate" \
            -backend-config="region=eu-west-1"

      - name: Verify
        env:
          STACK: ${{ matrix.stack }}
        run: |
          if [ -f verify.sh ]; then
            bash verify.sh
          else
            echo "::notice::$STACK has no verify.sh, so there is nothing to verify."
          fi

  # The only check branch protection needs: `plan` is skipped when no lab changed.
  tf-plan:
    name: tf-plan
    needs: [stacks, plan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a needed job failed or was cancelled, or if the labs cannot be planned
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          STACKS: ${{ needs.stacks.outputs.stacks }}
          CAN_PLAN: ${{ needs.stacks.outputs.can_plan }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure | cancelled)
                echo "::error::A needed job ended as: $result"
                exit 1
                ;;
            esac
          done
          if [ "$STACKS" != "[]" ] && [ "$CAN_PLAN" = "false" ]; then
            echo "::error::Lab changes from forks or Dependabot can't be planned. A maintainer pushes a commit with these changes to a branch of this repository."
            exit 1
          fi
