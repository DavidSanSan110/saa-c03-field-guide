name: Terraform

# No `paths` filter: the required `terraform` check must always report, never sit on "pending".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stacks:
    name: stacks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the stacks to check come from the diff against the base branch
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `shell: bash` runs with pipefail, so a failing tf-stacks fails the step instead of
      # publishing pnpm's error line. pnpm prints a banner first: the JSON array is the last line.
      - name: List the stacks to check
        id: stacks
        shell: bash
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            stacks="$(pnpm guardrails tf-stacks --base "$BASE" | tail -n 1)"
          else
            stacks="$(pnpm guardrails tf-stacks --all | tail -n 1)"
          fi
          case "$stacks" in
            "["*) ;;
            *)
              echo "::error::tf-stacks did not print a JSON array: $stacks"
              exit 1
              ;;
          esac
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "Stacks to check: $stacks"

  check:
    name: check (${{ matrix.stack }})
    needs: stacks
    if: ${{ needs.stacks.outputs.stacks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Terraform version
        id: terraform-version
        # Runs from the repository root: `.terraform-version` is the single source of the version.
        working-directory: ${{ github.workspace }}
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      - name: TFLint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids the anonymous rate limit when downloading plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: TFLint
        run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Checkov
        run: pipx run checkov==3.3.23 --config-file "$GITHUB_WORKSPACE/.checkov.yaml" --directory .

      - name: Terraform tests
        run: terraform test

  # The only check branch protection needs: `check` is skipped when no stack changed.
  terraform:
    name: terraform
    needs: [stacks, check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure | cancelled)
                echo "A needed job ended as: $result"
                exit 1
                ;;
            esac
          done
