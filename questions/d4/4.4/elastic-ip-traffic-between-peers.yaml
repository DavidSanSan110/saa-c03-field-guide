stem: "A game studio runs a cluster of EC2 game servers in one VPC. Each server has an Elastic IP address, and the servers' configuration files list the Elastic IP addresses of their peers for state synchronization, which moves a large volume of data between them. The servers never need to be reached from the internet for this synchronization. The monthly bill shows significant data transfer charges for traffic between instances of the same VPC. What is the best way to reduce these charges without losing connectivity between the servers?"
options:
  - key: A
    text: 'Change the configuration so the servers reach each other through their private IPv4 addresses or private DNS names.'
    correct: true
    why: "Instances that talk to each other through a public NAT IP address, such as an Elastic IP, are charged for regional or internet data transfer. Switching to the private addresses keeps the traffic on the VPC's private path and avoids that public-address charge. The security group rules only need to reference the private addresses or the group."
  - key: B
    text: 'Replace the Elastic IP addresses with auto-assigned public IPv4 addresses.'
    correct: false
    why: 'An auto-assigned address is still a public IPv4 address. Traffic sent to it is still counted as public-address traffic, and the address is billed as well, so the change would not remove the data transfer charge.'
  - key: C
    text: 'Route the synchronization traffic through a NAT gateway in each Availability Zone.'
    correct: false
    why: 'A NAT gateway adds an hourly charge and a per-GB processing charge on top of the transfer. It is meant for outbound internet access, not for traffic between instances in the same VPC.'
  - key: D
    text: 'Move the servers to an instance type with enhanced networking.'
    correct: false
    why: 'Enhanced networking raises bandwidth and lowers latency, but it has no effect on how traffic is billed. The charge depends on whether the traffic uses public or private addresses and on where it flows.'
cue: 'instances in the same VPC calling each other by Elastic IP: public-address traffic is charged as regional or internet transfer, so use private addresses'
