stem: 'A company is preparing for a security audit of its AWS account. The auditor asks for two things. First, a single report that lists every IAM user together with whether a console password is set, whether MFA is active and how old each access key is. Second, for one particular developer user, evidence of which AWS services the user has actually accessed so that unused permissions can be removed. Which actions will provide this information? (Choose two.)'
options:
  - key: A
    text: 'Generate and download the IAM credential report.'
    correct: true
    why: 'The credential report is an account-level CSV listing all users and the status of their credentials: password, MFA, access key rotation and last use.'
  - key: B
    text: "View the last accessed information (Access Advisor) for the developer's IAM user."
    correct: true
    why: 'The last accessed information shows which services the permissions of the identity allow and when each one was last used, so unused permissions can be trimmed toward least privilege.'
  - key: C
    text: 'Use AWS Cost Explorer and group the costs by IAM user.'
    correct: false
    why: 'Cost data is not attributed to individual IAM users and says nothing about credential status or permission use.'
  - key: D
    text: "Turn on VPC Flow Logs for the account's VPCs and analyze the traffic of the developer."
    correct: false
    why: 'Flow logs record network traffic metadata inside VPCs. They do not identify IAM principals, MFA status or the AWS services an identity called.'
  - key: E
    text: 'Enable Amazon S3 server access logging on all buckets.'
    correct: false
    why: 'These logs cover only requests to S3 buckets, so they cannot show credential status for all users or the use of other services.'
cue: 'all users + MFA + key age -> credential report; which services a user used -> Access Advisor'
references:
