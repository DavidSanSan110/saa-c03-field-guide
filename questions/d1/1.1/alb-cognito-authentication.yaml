stem: 'A company runs a customer portal on a fleet of EC2 instances, and an Application Load Balancer receives all requests for it. The portal software has no login feature and the vendor does not allow code changes. The company must now require customers to sign in, with a user directory that also supports sign-in with a social identity provider, before any request reaches the application. Which option needs the LEAST development effort?'
options:
  - key: A
    text: 'Create an Amazon Cognito user pool with the social identity provider enabled, and add an authenticate-cognito action ahead of the forward action in the rules of an HTTPS listener on the ALB.'
    correct: true
    why: 'The ALB can authenticate users itself through a Cognito user pool (which can federate social providers) or an OIDC provider. Unauthenticated requests are redirected to sign in, and the application receives the verified user claims in headers, so no application change is needed.'
  - key: B
    text: 'Create an Amazon Cognito identity pool and have the application request temporary AWS credentials for each visitor.'
    correct: false
    why: 'ALB authentication works with user pools or an OIDC identity provider, not with identity pools. Requesting credentials would also require code in the application, which is not allowed.'
  - key: C
    text: 'Add an authenticate-cognito action to the rules of the existing HTTP listener on port 80.'
    correct: false
    why: 'The authenticate-cognito and authenticate-oidc actions are supported only on HTTPS listeners, because the session cookie must be secure.'
  - key: D
    text: 'Create an IAM user for every customer and have customers sign in to the AWS access portal before using the portal.'
    correct: false
    why: 'IAM users are meant for people who operate the AWS account, not for the customers of an application, and the ALB does not check IAM sign-ins. It would not scale and does not provide the required social sign-in.'
cue: 'add sign-in to an existing app behind an ALB without changing its code: ALB authenticate-cognito action on an HTTPS listener with a user pool'
