stem: "A company wants to let a SaaS vendor read cost and usage data from its AWS account. The vendor serves hundreds of customers from one AWS account and assumes a role in each customer account to collect the data. The security team must make sure that another customer of the vendor cannot trick the vendor into reading this company's data. Which actions should the company take? (Choose two.)"
options:
  - key: A
    text: "Create an IAM role whose trust policy names the vendor's AWS account as the principal and requires a matching sts:ExternalId condition value."
    correct: true
    why: 'A cross-account role is the right way to delegate access to a third party, and the sts:ExternalId condition in the trust policy makes the AssumeRole call fail unless the caller supplies the expected value. This is the documented defence against the confused deputy problem.'
  - key: B
    text: "Use the unique external ID that the vendor generates for this company, and put that value in the role's trust policy."
    correct: true
    why: "The value has to be unique among the vendor's customers and controlled by the vendor, which always sends the ID of the customer it is acting for. Another customer can hand over this role ARN but cannot make the vendor send this company's ID."
  - key: C
    text: 'Create an IAM user for the vendor and hand its long-term access keys to the vendor over a secure channel.'
    correct: false
    why: 'Long-lived keys held by a third party need manual rotation and are not temporary credentials. It also does not address the requirement: the vendor would still be the shared deputy, and a role with an external ID is the intended pattern.'
  - key: D
    text: "Trust the vendor's account in the role with no extra condition, and keep the role ARN confidential."
    correct: false
    why: 'A role ARN is not a secret, and the confused deputy attack works precisely because another customer can supply it to the vendor. Without an external ID condition the vendor can be tricked into assuming the role.'
  - key: E
    text: 'Choose the external ID yourself, for example your own account ID, and tell the vendor to use it.'
    correct: false
    why: "The external ID must be unique across the vendor's customers and controlled by the vendor, not by the customer. A value you invent (or an account ID that others may know) does not give that guarantee."
cue: 'vendor assumes a role in each customer account, another customer must not trick the vendor: cross-account role with sts:ExternalId, value supplied by the vendor'
