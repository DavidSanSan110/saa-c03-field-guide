id: 'd1-1.2-0015'
domain: 1
task: '1.2'
services:
  - 'vpc'
difficulty: hard
type: single
stem: "A company hosts a public website on an EC2 instance (10.0.1.10) in a subnet associated with a custom network ACL. The instance's security group allows inbound TCP 443 from 0.0.0.0/0 and has the default allow-all outbound rule. The network ACL has an inbound rule allowing TCP 443 from 0.0.0.0/0 and an outbound rule allowing only TCP 443 to 0.0.0.0/0. Users report that connections time out. A VPC Flow Log on the instance's network interface shows two records for one client, 203.0.113.25. The first is 203.0.113.25 to 10.0.1.10 with destination port 443, action ACCEPT. The second is 10.0.1.10 to 203.0.113.25 with source port 443 and destination port 49321, action REJECT. What should a solutions architect do to fix the problem?"
options:
  - key: A
    text: 'Add an outbound rule to the security group that allows TCP ports 1024-65535 to 0.0.0.0/0.'
    correct: false
    why: 'Security groups are stateful, so replies to allowed inbound traffic are already permitted regardless of outbound rules. The security group is not what rejected the reply.'
  - key: B
    text: 'Add an outbound rule to the network ACL that allows TCP port 443 to 0.0.0.0/0 with a higher priority.'
    correct: false
    why: "The existing outbound rule already allows port 443, but the reply is sent to the client's ephemeral port (49321), not to port 443. A rule matching destination port 443 does not match the reply."
  - key: C
    text: 'Add an inbound rule to the network ACL that allows TCP port 443 from 203.0.113.25.'
    correct: false
    why: 'The flow log already shows the inbound request as ACCEPT, so inbound filtering is not the problem. The failing record is the outbound reply.'
  - key: D
    text: 'Add an outbound rule to the network ACL that allows TCP ports 1024-65535 to 0.0.0.0/0.'
    correct: true
    why: 'Network ACLs are stateless, so responses are evaluated against the outbound rules. The ACCEPT on the request combined with a REJECT on the reply points to the network ACL, and allowing the ephemeral port range as destination ports lets replies reach clients whatever port they chose.'
cue: 'inbound ACCEPT but the reply REJECT in flow logs, security group allows -> stateless NACL, open ephemeral ports outbound'
