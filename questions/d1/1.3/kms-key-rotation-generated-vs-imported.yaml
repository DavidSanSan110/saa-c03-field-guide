difficulty: hard
type: multiple
stem: 'A company policy requires the key material of every customer managed key to be replaced once a year, without breaking existing encrypted data. Two symmetric customer managed keys are in scope. Key A was created with key material generated by AWS KMS and has never been rotated. Key B was created without key material, and the company imported its own material. Applications refer to both keys through aliases. Which actions meet the policy? (Choose two.)'
options:
  - key: A
    text: 'Enable automatic key rotation on key A.'
    correct: true
    why: 'Automatic rotation is optional for customer managed keys, and it is supported on symmetric keys whose material was generated by KMS. The key ID and ARN stay the same and KMS keeps the previous material, so existing ciphertext still decrypts.'
  - key: B
    text: 'Enable automatic key rotation on key B.'
    correct: false
    why: 'Keys with imported key material do not support automatic rotation.'
  - key: C
    text: 'For key B, create a new KMS key with new imported material, point the alias used by the applications to it, and keep key B enabled so old data can be decrypted.'
    correct: true
    why: 'Manual rotation replaces one key with another. Updating the alias avoids application changes, and the old key must stay enabled because KMS needs it to decrypt data encrypted earlier.'
  - key: D
    text: 'Do nothing for key A: AWS KMS rotates every KMS key automatically each year.'
    correct: false
    why: 'Yearly automatic rotation applies to AWS managed keys. For customer managed keys rotation happens only after it is enabled.'
  - key: E
    text: 'For key B, create a replacement key, repoint the alias, and then schedule key B for deletion because it is no longer used.'
    correct: false
    why: 'Data encrypted under key B can only be decrypted with key B. Deleting it would make that data unrecoverable, so the original key has to remain available.'
cue: 'customer managed key rotation must be enabled; imported key material has no automatic rotation -> manual rotation with alias'
