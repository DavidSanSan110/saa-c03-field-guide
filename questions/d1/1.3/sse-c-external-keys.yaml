stem: "A healthcare company stores scanned records in Amazon S3. Its security policy says the encryption keys must stay in the company's own on-premises key manager and must never be persisted by AWS. The development team does not want to add encryption libraries to the application: Amazon S3 itself should encrypt each object as it is written and decrypt it when it is read, with the application sending the key along with every request over a secure connection. Which encryption option meets these requirements?"
options:
  - key: A
    text: 'SSE-S3, where Amazon S3 creates and manages the keys'
    correct: false
    why: 'With SSE-S3 the keys are owned, managed and stored by Amazon S3, so the company cannot keep them in its own key manager.'
  - key: B
    text: 'Server-side encryption with a customer managed key in AWS KMS (SSE-KMS)'
    correct: false
    why: 'The key lives in and is managed by AWS KMS. You get control and CloudTrail auditing, but the key is still stored by AWS, which the policy forbids.'
  - key: C
    text: "SSE-C, sending the company's own key with each HTTPS request"
    correct: true
    why: 'With SSE-C the customer supplies the key in the request headers, S3 does the encryption and decryption, and S3 never stores the key. HTTPS is mandatory. Note that SSE-C is blocked by default on current buckets and has to be explicitly enabled through the bucket encryption configuration.'
  - key: D
    text: 'DSSE-KMS, two layers of encryption with a key held in AWS KMS'
    correct: false
    why: 'DSSE-KMS applies two encryption layers, but both rely on keys held by AWS (a KMS key plus an S3-managed key). It addresses multi-layer compliance, not keeping keys outside AWS.'
cue: 'keys never stored by AWS + S3 still does the encrypt/decrypt + key sent with each request over HTTPS -> SSE-C'
