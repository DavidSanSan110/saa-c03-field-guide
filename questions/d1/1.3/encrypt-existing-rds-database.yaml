stem: 'A company runs a production Amazon RDS for MySQL DB instance that was created without storage encryption. A new compliance rule requires encryption at rest with an AWS KMS key, and a short cutover window for the application is acceptable. Which approach adds encryption to the existing database?'
options:
  - key: A
    text: 'Modify the DB instance and turn on storage encryption with the chosen KMS key'
    correct: false
    why: 'Encryption can only be chosen when a DB instance is created. It cannot be switched on for an existing unencrypted instance.'
  - key: B
    text: 'Create a read replica, enable encryption on the replica, and promote it'
    correct: false
    why: 'A read replica of an unencrypted DB instance cannot be encrypted, so this path is not possible.'
  - key: C
    text: 'Take a manual snapshot and restore it as a new DB instance while specifying a KMS key'
    correct: false
    why: 'An unencrypted snapshot cannot be restored directly to an encrypted DB instance. The snapshot has to be copied with encryption first.'
  - key: D
    text: 'Take a manual snapshot, copy it with encryption enabled using a KMS key, restore a new DB instance from the encrypted copy, and point the application at it'
    correct: true
    why: 'Copying the unencrypted snapshot with encryption turned on produces an encrypted snapshot. Restoring from that copy gives an encrypted DB instance, and a new endpoint means the application is repointed during the cutover.'
cue: 'unencrypted RDS + needs encryption now -> snapshot, encrypted copy, restore'
