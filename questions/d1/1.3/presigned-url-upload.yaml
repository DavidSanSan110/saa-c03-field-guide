stem: 'A photo-sharing startup lets signed-in mobile users upload one profile picture to a private Amazon S3 bucket. The users have no AWS credentials and the user base changes constantly. Each upload must be allowed only for one specific object key and only for a few minutes. The team wants the least operational overhead and no public write access to the bucket. What should the solutions architect recommend?'
options:
  - key: A
    text: 'Have the backend (for example, a Lambda function with an execution role that can put objects) authenticate the user and return a short-lived presigned PUT URL for that object key'
    correct: true
    why: 'A presigned URL grants time-limited access to one operation on one key using the permissions of the identity that created it, so users need no AWS credentials. It scales to any number of users with no per-user IAM setup.'
  - key: B
    text: 'Create an IAM user for every app user with a policy restricted to their prefix'
    correct: false
    why: 'This is heavy to manage for a constantly changing user base, distributes long-term credentials, and does not give a few-minutes expiry per upload.'
  - key: C
    text: 'Add a bucket policy that allows s3:PutObject to any principal on the uploads prefix'
    correct: false
    why: 'This opens the bucket to public writes: it is not tied to a given user or object key and has no expiry.'
  - key: D
    text: 'Return a presigned GET URL for the object key and let the app use it to upload'
    correct: false
    why: 'A presigned URL is bound to one HTTP method. A GET URL only allows downloading, so an upload needs a presigned PUT URL.'
cue: 'no AWS credentials + one key + a few minutes + private bucket -> presigned URL generated by the backend'
