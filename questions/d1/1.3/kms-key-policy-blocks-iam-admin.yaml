stem: 'A security engineer created a symmetric customer managed KMS key with the AWS CLI and supplied a custom key policy that allows only a role named PayrollApp to use the key. Later, a platform administrator whose IAM role has an identity policy allowing kms:* on all resources tries to describe and use the key and gets an access denied error. No policy contains an explicit deny, and the account owner wants IAM policies to be able to control access to this key from now on. What should be done?'
options:
  - key: A
    text: "Add more kms:* permissions to the administrator's IAM policy, because identity policies take precedence over resource policies."
    correct: false
    why: 'The identity policy already allows kms:*. A KMS key policy does not trust the account by default, so an IAM policy that allows access is ineffective until the key policy permits the account to use IAM policies.'
  - key: B
    text: 'Update the key policy, using a principal that is allowed to change it, to add a statement that allows the account (the account root principal) kms:*, which turns on IAM policies for the key.'
    correct: true
    why: 'The default key policy contains exactly this statement. With the account principal in the key policy, IAM policies in the account can delegate access to the key; without it, IAM policies that allow access are ineffective.'
  - key: C
    text: 'Attach a service control policy in AWS Organizations that allows kms:* on the key.'
    correct: false
    why: 'An SCP only sets a maximum of permissions for an account and never grants access by itself. It cannot replace the missing allow in the key policy.'
  - key: D
    text: 'Enable automatic key rotation, which recreates the default key policy.'
    correct: false
    why: 'Rotation creates new key material and keeps the same key ID and policy. It does not change who can use the key.'
cue: 'custom key policy names only one role; admin with kms:* in IAM still denied; need IAM policies to work for the key'
