stem: "A company's AWS Lambda functions connect to an Amazon Aurora MySQL cluster. The master password is currently stored in the functions' environment variables. A new security standard requires the database password to change automatically every 30 days without anyone editing function configuration, and the team wants the least operational overhead. Which solution meets these requirements?"
options:
  - key: A
    text: 'Store the credentials in an AWS Secrets Manager secret, turn on automatic rotation with a 30-day schedule, and have the functions read the secret at run time.'
    correct: true
    why: 'Secrets Manager supports automatic rotation on a schedule for Aurora and RDS credentials: it runs a rotation function that changes the password in both the secret and the database. Because the functions fetch the current value at run time, no configuration needs editing.'
  - key: B
    text: 'Store the password as a Systems Manager Parameter Store SecureString and rely on the parameter to rotate itself every 30 days.'
    correct: false
    why: 'Parameter Store encrypts SecureString values with KMS but offers no credential rotation. Something custom would have to change the database password and the parameter, which is the overhead the team wants to avoid.'
  - key: C
    text: 'Keep the password in Lambda environment variables encrypted with a customer managed KMS key, and enable automatic rotation on that KMS key.'
    correct: false
    why: 'KMS key rotation changes the key material that protects data; it never changes the password inside the database or the stored value. Environment variables have no rotation mechanism.'
  - key: D
    text: 'Store the password in an advanced-tier Parameter Store parameter with an expiration policy of 30 days.'
    correct: false
    why: 'Parameter policies can enforce expiration and send notifications, but they do not generate a new password or update the database. The password would still have to be changed by hand or by custom code.'
cue: 'automatically change the database password on a schedule, least overhead -> Secrets Manager rotation'
