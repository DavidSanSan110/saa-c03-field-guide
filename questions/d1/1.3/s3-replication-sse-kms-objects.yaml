id: 'd1-1.3-0014'
domain: 1
task: '1.3'
services:
  - 's3'
  - 'kms'
  - 'iam'
difficulty: hard
type: multiple
stem: 'A company has a versioned Amazon S3 bucket in eu-west-1 whose default encryption is SSE-KMS with a customer managed key. The company created a cross-Region replication rule to a versioned bucket in eu-central-1, but objects encrypted with SSE-KMS never show up in the destination bucket. The company wants to keep SSE-KMS on both sides. Which actions are required? (Choose three.)'
options:
  - key: A
    text: 'Update the replication rule to opt in to replicating objects encrypted with AWS KMS keys.'
    correct: true
    why: 'By default S3 does not replicate SSE-KMS encrypted objects. The rule must explicitly enable replication of KMS-encrypted objects.'
  - key: B
    text: 'Specify a customer managed KMS key created in eu-central-1 in the rule, to encrypt the replicas.'
    correct: true
    why: 'The key named for replicas must be in the same Region as the destination bucket, because KMS keys do not exist outside the Region where they were created.'
  - key: C
    text: 'Give the replication IAM role kms:Decrypt on the source key and kms:Encrypt on the destination key.'
    correct: true
    why: 'S3 assumes the role to read and decrypt the source object and then encrypt the replica, so it needs decrypt permission on the source key and encrypt permission on the destination key.'
  - key: D
    text: 'Reference the eu-west-1 source key in the rule so that the replicas are encrypted with the same key.'
    correct: false
    why: "The key for replicas has to be in the destination bucket's Region. A single-Region key from eu-west-1 cannot be used in eu-central-1."
  - key: E
    text: "Set the destination bucket's default encryption to SSE-S3 so that replicas are re-encrypted on arrival."
    correct: false
    why: "Replicas of SSE-KMS objects keep the same encryption type as the source and the destination's default encryption is not applied to them. It would also not meet the goal of keeping SSE-KMS on both sides."
  - key: F
    text: 'Grant the replication role s3:GetObjectVersion on the source bucket instead of s3:GetObjectVersionForReplication.'
    correct: false
    why: 's3:GetObjectVersion allows replication of unencrypted and SSE-S3 objects but not of objects encrypted with KMS keys. The recommended s3:GetObjectVersionForReplication action is the one that covers KMS-encrypted objects.'
cue: 'SSE-KMS objects not replicated -> opt in in the rule, destination-Region key, role with Decrypt on source and Encrypt on destination'
references:
  - 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-config-for-kms-objects.html'
